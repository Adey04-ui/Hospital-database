app = "hospital-backend"          # Change to your desired name
primary_region = "lhr"            # London (close to Nigeria) or "ams", "cdg", etc.

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  # Add your other env vars here or use secrets

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1